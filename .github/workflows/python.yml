name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run once per week (Friday at 06:00 UTC)
  schedule:
    - cron: '0 6 * * 5'

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out filetreesubs
        uses: actions/checkout@v7
      - name: Setup nox
        uses: wntrblm/nox@2026.10.20
        with:
          python-versions: "3.14"
      - name: Run linters
        run: |
          nox -v -e lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out filetreesubs
        uses: actions/checkout@v7
      - name: Setup nox
        uses: wntrblm/nox@2026.10.20
        with:
          python-versions: "3.10,3.11,3.12,3.13,3.14,3.15"
      - name: Run tests
        run: |
          nox -v -e test --pythons 3.10 3.11 3.12 3.13 3.14 3.15
      - name: Report coverage
        run: |
          nox -v -e coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v7
  test-39:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out filetreesubs
        uses: actions/checkout@v7
      - name: Setup nox
        uses: wntrblm/nox@2026.10.20
        with:
          python-versions: "3.9"
      - name: Run tests
        run: |
          nox -v -e test --pythons 3.9
      - name: Report coverage
        run: |
          nox -v -e coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v7
